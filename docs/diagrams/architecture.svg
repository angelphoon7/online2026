<text x="108" y="526" font-size="20" fill="#cbd5e1" font-weight="400" >EIP-712 signature → IntentRegistry</text><text x="108" y="552" font-size="20" fill="#cbd5e1" font-weight="400" >Bound to chain ID + registry address</text><text x="108" y="578" font-size="20" fill="#cbd5e1" font-weight="400" >Users need not return to approve</text><text x="108" y="604" font-size="20" fill="#cbd5e1" font-weight="400" >the discovered settlement proposal.</text>
