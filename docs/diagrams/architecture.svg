<text x="108" y="369" font-size="20" fill="#cbd5e1" font-weight="400" >Swapper · buyer · seller · issuer</text><text x="108" y="399" font-size="20" fill="#cbd5e1" font-weight="400" >Choose tickets and outcome conditions</text><text x="108" y="429" font-size="20" fill="#cbd5e1" font-weight="400" >Approve / deposit · sign / commit</text>
