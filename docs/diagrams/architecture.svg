<text x="1202" y="995" font-size="20" fill="#94a3b8" font-weight="400" >Current backend uses Arc RPC logs; no subgraph is connected.</text>
<text x="64" y="1057" font-size="17" fill="#94a3b8" font-weight="400" >Implementation: app/reshuffle · app/api · server/ · solver/ · src/     |     Simulation does not lock state; contracts revalidate at execution.</text>
