<text x="678" y="491" font-size="20" fill="#cbd5e1" font-weight="400" >Read custody, intents and payment capacity</text><text x="678" y="518" font-size="20" fill="#cbd5e1" font-weight="400" >Bounded search · deterministic ranking</text><text x="678" y="545" font-size="20" fill="#cbd5e1" font-weight="400" >Least gross cash moved among candidates</text><text x="678" y="572" font-size="20" fill="#cbd5e1" font-weight="400" >found within the search budget · eth_call</text>
<rect x="658" y="610" width="452" height="186" rx="16" fill="#142036" stroke="#334155" />
