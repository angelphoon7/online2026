<text x="1298" y="727" font-size="19" fill="#6ee7b7" font-weight="700" >1  Mark intents settled     2  Pull / push net USDC</text>
<text x="1298" y="758" font-size="19" fill="#6ee7b7" font-weight="700" >3  Release tickets            4  Emit settlement event</text>

