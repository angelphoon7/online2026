[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@1inch/solidity-utils/=lib/solidity-utils/",
    "@1inch/aqua/=lib/aqua/",
    "@1inch/swap-vm/=lib/swap-vm/",
]

[profile.default.fuzz]
runs = 256
