[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
# Keep deployment bytecode on the Paris EVM target.
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./.data" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
arc_testnet = "${ARC_RPC}"
